name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run jev-eval validate
      - run: uv run jev-eval validate --data data/expanded
      - run: uv run jev-eval dry-run --out results/requests.jsonl
